<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Shutpoint</title>
  <meta name="description" content="Inicia sesión en Shutpoint CRM." />
  <link rel="icon" type="image/png" href="assets/brand/shutpoint-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body class="login-page">
  <main class="login">
    <!-- LEFT (navy) -->
    <section class="login-left">
      <img class="login-icon-bg" src="assets/brand/shutpoint-icon.png" alt="" aria-hidden="true" />
      <nav class="login-top-links">
        <a href="index.html#contacto">Contáctanos</a>
        <a href="#">Terminos y condiciones</a>
      </nav>

      <div class="login-left-mid">
        <h1>Con <strong>Shutpoint CRM</strong> podras tener un <strong>mayor control</strong> sobre tu proceso de ventas y con ello <strong>aumentar tus ganancias</strong>.</h1>
        <p class="login-noaccount">¿No tienes cuenta?</p>
        <a href="index.html#contacto" class="login-register">registrate</a>
      </div>

      <img class="login-powered" src="assets/brand/powered-by-axsis-white.png" alt="powered by axsis" />
    </section>

    <!-- RIGHT (white) -->
    <section class="login-right">
      <div class="login-card">
        <a href="index.html"><img class="login-logo" src="assets/brand/shutpoint-logo-trim.png" alt="Shutpoint" /></a>
        <h2 class="login-title">Iniciar sesión</h2>

        <form id="loginForm" novalidate>
          <label for="email">correo</label>
          <input type="email" id="email" name="email" autocomplete="email" />

          <label for="pass">contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="pass" name="pass" autocomplete="current-password" />
            <button type="button" class="pass-eye" id="passEye" aria-label="Mostrar u ocultar contraseña">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>

          <button type="submit" class="login-submit">Ingresar</button>

          <div class="login-remember">
            <span>recordar</span>
            <button type="button" class="switch on" id="rememberToggle" role="switch" aria-checked="true" aria-label="Recordar sesión"><span class="knob"></span></button>
          </div>

          <a href="#" class="login-recover">Recuperar contraseña</a>
          <p class="login-msg" id="loginMsg" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <script>
    /* Password visibility toggle */
    const eye = document.getElementById('passEye');
    const pass = document.getElementById('pass');
    eye.addEventListener('click', () => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      eye.classList.toggle('on', show);
    });

    /* Remember switch */
    const sw = document.getElementById('rememberToggle');
    sw.addEventListener('click', () => {
      const on = sw.classList.toggle('on');
      sw.setAttribute('aria-checked', on ? 'true' : 'false');
    });

    /* Submit (demo) */
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('loginMsg');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email || !pass.value) {
        msg.hidden = false;
        msg.className = 'login-msg err';
        msg.textContent = 'Ingresa tu correo y contraseña.';
        return;
      }
      msg.hidden = false;
      msg.className = 'login-msg ok';
      msg.textContent = 'Verificando credenciales...';
    });
  </script>
</body>
</html>
