<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Shutpoint</title>
  <meta name="description" content="Inicia sesión en Shutpoint CRM." />
  <link rel="icon" type="image/png" href="assets/brand/shutpoint-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=33" />
</head>
<body class="login-page">
  <main class="login">
    <!-- LEFT (navy) -->
    <section class="login-left">
      <img class="login-icon-bg" src="assets/brand/shutpoint-icon.png" alt="" aria-hidden="true" />
      <nav class="login-top-links">
        <a href="index.html#contacto" class="i18n-desc">Contáctanos</a>
        <a href="#" class="i18n-desc">Terminos y condiciones</a>
      </nav>
      <div class="lang-switch" id="langSwitchLogin">
        <button type="button" class="lang-flag active" id="btnLangEs" onclick="setLang('es')" title="Español">
          <img src="https://flagcdn.com/w40/mx.png" alt="ES" class="flag-img" />
        </button>
        <button type="button" class="lang-flag" id="btnLangEn" onclick="setLang('en')" title="English">
          <img src="https://flagcdn.com/w40/us.png" alt="EN" class="flag-img" />
        </button>
      </div>
      <a href="index.html" class="login-logo-left">
        <img src="assets/brand/shutpoint-logo-trim.png" alt="Shutpoint" />
      </a>

      <div class="login-left-mid">
        <h1 id="i18nLoginHeroTitle">Con <strong>Shutpoint CRM</strong> podras tener un <strong>mayor control</strong> sobre tu proceso de ventas y con ello <strong>aumentar tus ganancias</strong>.</h1>
        <p class="login-noaccount i18n-desc">¿No tienes cuenta?</p>
        <a href="index.html#contacto" class="login-register i18n-desc">registrate</a>
      </div>

      <img class="login-powered" src="assets/brand/powered-by-axsis-white.png" alt="powered by axsis" />
    </section>

    <!-- RIGHT (white) -->
    <section class="login-right">
      <div class="login-card">
        <h2 class="login-title i18n-desc">Iniciar sesión</h2>

        <form id="loginForm" novalidate>
          <label for="email" class="i18n-desc">correo</label>
          <input type="email" id="email" name="email" autocomplete="email" />

          <label for="pass" class="i18n-desc">contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="pass" name="pass" autocomplete="current-password" />
            <button type="button" class="pass-eye" id="passEye" aria-label="Mostrar u ocultar contraseña">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>

          <button type="submit" class="login-submit i18n-desc">Ingresar</button>

          <div class="login-remember">
            <span class="i18n-desc">recordar</span>
            <button type="button" class="switch on" id="rememberToggle" role="switch" aria-checked="true" aria-label="Recordar sesión"><span class="knob"></span></button>
          </div>

          <a href="#" class="login-recover i18n-desc">Recuperar contraseña</a>
          <p class="login-msg" id="loginMsg" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <script src="assets/i18n.js?v=1"></script>
  <script>
    /* Alinear el logo del panel izquierdo con "Iniciar sesión" */
    function alignLoginLogo() {
      const logo = document.querySelector('.login-logo-left');
      const title = document.querySelector('.login-title');
      const left = document.querySelector('.login-left');
      if (!logo || !title || !left) return;
      if (getComputedStyle(logo).position !== 'absolute') return; // layout apilado en móvil
      const titleTop = title.getBoundingClientRect().top;
      const leftTop = left.getBoundingClientRect().top;
      const logoHeight = logo.getBoundingClientRect().height;
      const titleHeight = title.getBoundingClientRect().height;
      const offset = (titleTop - leftTop) + (titleHeight - logoHeight) / 2;
      logo.style.top = Math.max(0, offset) + 'px';
    }
    alignLoginLogo();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignLoginLogo);
    window.addEventListener('load', alignLoginLogo);
    window.addEventListener('resize', alignLoginLogo);

    /* Password visibility toggle */
    const eye = document.getElementById('passEye');
    const pass = document.getElementById('pass');
    eye.addEventListener('click', () => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      eye.classList.toggle('on', show);
    });

    /* Remember switch */
    const sw = document.getElementById('rememberToggle');
    sw.addEventListener('click', () => {
      const on = sw.classList.toggle('on');
      sw.setAttribute('aria-checked', on ? 'true' : 'false');
    });

    /* Submit (demo) */
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('loginMsg');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const t = txt => (window.__spLang === 'en' && window.SP_DICT && SP_DICT[txt]) ? SP_DICT[txt] : txt;
      if (!email || !pass.value) {
        msg.hidden = false;
        msg.className = 'login-msg err';
        msg.textContent = t('Ingresa tu correo y contraseña.');
        return;
      }
      msg.hidden = false;
      msg.className = 'login-msg ok';
      msg.textContent = t('Verificando credenciales...');
    });
  </script>
</body>
</html>
